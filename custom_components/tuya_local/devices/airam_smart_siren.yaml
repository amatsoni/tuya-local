name: Siren
products:
  - id: key8vv49fknghdey
    manufacturer: Airam
    model: Smart Siren
  - id: obcce4mdfd60yx8r
    manufacturer: Airam
    model: Smart Siren
entities:
  - entity: siren
    dps:
      - id: 1
        type: string
        name: tone
        mapping:
          - dps_val: normal
            value: "off"
          - dps_val: alarm_sound
            value: sound
            default: true
          - dps_val: alarm_light
            value: light
          - dps_val: alarm_sound_light
            value: sound_and_light
      - id: 5
        type: string
        name: volume_level
        optional: true
        mapping:
          - dps_val: mute
            value: 0.0
          - dps_val: low
            value: 0.33
          - dps_val: middle
            value: 0.67
          - dps_val: high
            value: 1.0
      - id: 7
        type: integer
        name: duration
        optional: true
        unit: s
        range:
          min: 60
          max: 3600
  - entity: select
    name: Volume
    category: config
    dps:
      - id: 5
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: low
            value: Low
          - dps_val: middle
            value: Medium
          - dps_val: high
            value: High
          - dps_val: mute
            value: Mute
  - entity: number
    name: Alarm duration
    category: config
    dps:
      - id: 7
        type: integer
        name: value
        optional: true
        unit: s
        range:
          min: 60
          max: 3600
        mapping:
          - step: 60
  - entity: switch
    name: Mute
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch
        optional: true
  - entity: button
    name: Self test
    category: diagnostic
    dps:
      - id: 8
        type: boolean
        name: button
        optional: true
